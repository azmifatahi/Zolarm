name: Build Zolarm APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zolarm-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  GRADLE_VERSION: "8.7"
  JAVA_VERSION: "17"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Zolarm APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Accept Android licenses and ensure platform 34
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" \
            "$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          validate-wrappers: false

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type bin
          chmod +x ./gradlew

      - name: Verify keystore exists
        run: |
          ls -la keystore/
          test -f keystore/zolarm-debug.jks

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validate and prepare APK
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          DEST="app/build/outputs/apk/debug/Zolarm-debug.apk"
          if [ ! -f "$SRC" ]; then
            echo "APK not found!"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          # Must be a ZIP (APK is a zip)
          file "$SRC"
          unzip -t "$SRC" >/dev/null
          # Must contain AndroidManifest.xml
          unzip -l "$SRC" | grep -q "AndroidManifest.xml"
          SIZE=$(stat -c%s "$SRC")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "APK suspiciously small"
            exit 1
          fi
          cp -f "$SRC" "$DEST"
          ls -lah "$DEST"
          # Print package info if aapt available
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | head -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$DEST" | head -20 || true
          fi

      - name: Upload Zolarm Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zolarm-debug-apk
          path: app/build/outputs/apk/debug/Zolarm-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zolarm-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/**
          if-no-files-found: ignore
          retention-days: 7
