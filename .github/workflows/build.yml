name: Build Zolarm APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle task to run"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease

permissions:
  contents: read

concurrency:
  group: zolarm-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.7"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build Zolarm APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          validate-wrappers: false

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Room schemas
        uses: actions/cache@v4
        with:
          path: app/schemas
          key: room-schemas-${{ hashFiles('app/build.gradle.kts') }}

      - name: Assemble Debug APK
        if: ${{ github.event.inputs.build_type != 'assembleRelease' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble Release APK
        if: ${{ github.event.inputs.build_type == 'assembleRelease' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename debug APK to Zolarm-debug.apk
        if: ${{ github.event.inputs.build_type != 'assembleRelease' }}
        run: |
          set -e
          SRC_DIR="app/build/outputs/apk/debug"
          if [ -f "$SRC_DIR/app-debug.apk" ]; then
            mv "$SRC_DIR/app-debug.apk" "$SRC_DIR/Zolarm-debug.apk"
          fi
          ls -la "$SRC_DIR"

      - name: Rename release APK
        if: ${{ github.event.inputs.build_type == 'assembleRelease' }}
        run: |
          set -e
          SRC_DIR="app/build/outputs/apk/release"
          if [ -f "$SRC_DIR/app-release-unsigned.apk" ]; then
            mv "$SRC_DIR/app-release-unsigned.apk" "$SRC_DIR/Zolarm-release-unsigned.apk"
          fi
          ls -la "$SRC_DIR" || true

      - name: Upload Zolarm Debug APK
        if: ${{ github.event.inputs.build_type != 'assembleRelease' }}
        uses: actions/upload-artifact@v4
        with:
          name: Zolarm-debug-apk
          path: app/build/outputs/apk/debug/Zolarm-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Zolarm Release APK
        if: ${{ github.event.inputs.build_type == 'assembleRelease' }}
        uses: actions/upload-artifact@v4
        with:
          name: Zolarm-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zolarm-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
